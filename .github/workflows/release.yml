name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-24.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Clear Tauri cache and ensure fresh icons
        shell: bash
        run: |
          rm -rf src-tauri/target
          rm -rf ~/.cargo/registry/cache || true
          echo "Cleared Tauri build cache to ensure fresh icon build"

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Sync node version and setup cache
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify icon files before build
        shell: bash
        run: |
          echo "=== Verifying icon files exist and are current ==="
          ls -la src-tauri/icons/
          echo "Icon file sizes:"
          if command -v stat >/dev/null 2>&1; then
            if stat -c "%n: %s bytes" src-tauri/icons/icon.png 2>/dev/null; then
              stat -c "%n: %s bytes" src-tauri/icons/icon.png src-tauri/icons/icon.icns src-tauri/icons/32x32.png src-tauri/icons/128x128.png src-tauri/icons/128x128@2x.png 2>/dev/null || true
            else
              stat -f "%N: %z bytes" src-tauri/icons/icon.png src-tauri/icons/icon.icns src-tauri/icons/32x32.png src-tauri/icons/128x128.png src-tauri/icons/128x128@2x.png 2>/dev/null || true
            fi
          else
            echo "stat command not available, listing files only"
          fi
          echo "=== Icon verification complete ==="

      - name: Build the app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'DarkroomPro ${{ github.ref_name }}'
          releaseBody: |
            ## DarkroomPro ${{ github.ref_name }}

            **Agitation, rotary processing and batch reuse**

            ### Highlights
            - **Custom agitation:** initial agitation (30s default), then every N seconds for M seconds, with a soft repeating cue instead of a triple beep.
            - **Rotary / continuous processing:** applies the published -15% B&W developer-time adjustment; colour times are unchanged and agitation cues are suppressed.
            - **Batch reuse compensation:** CineStill +2% per roll; Tetenal +15s per 4 rolls at 38C (+60s at 30C); Bellini +15s per 3 rolls. Unsupported developers show no compensation.
            - **Colour temperature locked:** C-41/E-6 stay at the kit's standard temperature; alternative kit tables are opt-in.
            - **UI refresh:** rounded controls, clearer form sections, stronger contrast, stable buttons, dark native controls, no blocking alerts.
            - **Darkroom mode:** no longer auto-opens fullscreen; use Auto Fullscreen on Start or press F.

            ### Corrections
            - HC-110 Dilution E corrected to 1:47; T-Max Developer corrected to 1:4.
            - Rust and JS dilution amounts now round identically.
            - Colour push/pull is only offered where the kit publishes a time; no estimated values.
            - Added B&W temperature and volume validation; corrected 92 provenance labels and T-Max datasheet references.

            See [RELEASE_NOTES.md](https://github.com/Panolix/DarkroomPro/blob/main/RELEASE_NOTES.md) for the full list.

            ### Downloads
            - **macOS**: `.dmg` (universal)
            - **Windows**: `.msi` installer
            - **Linux**: `.deb`, `.rpm` or `.AppImage`

            > Release builds are unsigned. On macOS right-click and choose Open the first time; on Windows SmartScreen may prompt.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

