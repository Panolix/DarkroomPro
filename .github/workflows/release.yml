name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-24.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Clear Tauri cache and ensure fresh icons
        shell: bash
        run: |
          rm -rf src-tauri/target
          rm -rf ~/.cargo/registry/cache || true
          echo "Cleared Tauri build cache to ensure fresh icon build"

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Sync node version and setup cache
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify icon files before build
        shell: bash
        run: |
          echo "=== Verifying icon files exist and are current ==="
          ls -la src-tauri/icons/
          echo "Icon file sizes:"
          if command -v stat >/dev/null 2>&1; then
            if stat -c "%n: %s bytes" src-tauri/icons/icon.png 2>/dev/null; then
              stat -c "%n: %s bytes" src-tauri/icons/icon.png src-tauri/icons/icon.icns src-tauri/icons/32x32.png src-tauri/icons/128x128.png src-tauri/icons/128x128@2x.png 2>/dev/null || true
            else
              stat -f "%N: %z bytes" src-tauri/icons/icon.png src-tauri/icons/icon.icns src-tauri/icons/32x32.png src-tauri/icons/128x128.png src-tauri/icons/128x128@2x.png 2>/dev/null || true
            fi
          else
            echo "stat command not available, listing files only"
          fi
          echo "=== Icon verification complete ==="

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'DarkroomPro ${{ github.ref_name }}'
          releaseBody: |
            ## DarkroomPro ${{ github.ref_name }}

            Accuracy and reliability patch: geometric temperature interpolation, database clean-up, alphabetical developer sorting and a startup selection fix.

            ### Data
            - Removed the incorrect "Cinema film stock" handling note from 52 C-41 combinations across 13 standard colour films (Portra, Ektar, Gold, Superia, Vista and others); notes are kept only on genuine cine stocks (CineStill, Vision3)
            - Verified Fuji Acros II push times against the Massive Dev Chart (D-76 stock: 7.25 min at EI 100, 10 min at EI 200 and EI 400 — the identical push 1/push 2 values are published by the chart, not a transcription error)

            ### Calculations
            - Temperature interpolation is now geometric (log-space) in both the JavaScript and Rust engines: development time responds exponentially to temperature, so sparse colour-kit tables (Unicolor, Tetenal) no longer overestimate mid-range times (e.g. Unicolor C-41 at 30 °C: ~12 min → ~9.2 min; standard B&W temperatures unaffected)
            - Half-degree interpolation verified consistent across both engines
            - Offline fallback temperature table now mirrors the database's Ilford conversion chart values

            ### Interface
            - Developer dropdown is now sorted alphabetically by developer name, with dilution variants grouped under their developer (previously it followed raw database order, which differed per film)
            - Film categories remain fixed on every start: Black & White → C-41 → E-6
            - Verified that a film selected immediately at startup is no longer lost when the database finishes loading

            ### Downloads
            - **macOS**: `.dmg` (universal)
            - **Windows**: `.msi` installer
            - **Linux**: `.deb`, `.rpm` or `.AppImage`

            > Release builds are unsigned. On macOS right-click and choose Open the first time; on Windows SmartScreen may prompt.

            See the [README](https://github.com/Panolix/DarkroomPro/blob/main/README.md) for installation instructions.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

