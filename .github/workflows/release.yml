name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-24.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Clear Tauri cache and ensure fresh icons
        shell: bash
        run: |
          rm -rf src-tauri/target
          rm -rf ~/.cargo/registry/cache || true
          echo "Cleared Tauri build cache to ensure fresh icon build"

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Sync node version and setup cache
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify icon files before build
        shell: bash
        run: |
          echo "=== Verifying icon files exist and are current ==="
          ls -la src-tauri/icons/
          echo "Icon file sizes:"
          if command -v stat >/dev/null 2>&1; then
            if stat -c "%n: %s bytes" src-tauri/icons/icon.png 2>/dev/null; then
              stat -c "%n: %s bytes" src-tauri/icons/icon.png src-tauri/icons/icon.icns src-tauri/icons/32x32.png src-tauri/icons/128x128.png src-tauri/icons/128x128@2x.png 2>/dev/null || true
            else
              stat -f "%N: %z bytes" src-tauri/icons/icon.png src-tauri/icons/icon.icns src-tauri/icons/32x32.png src-tauri/icons/128x128.png src-tauri/icons/128x128@2x.png 2>/dev/null || true
            fi
          else
            echo "stat command not available, listing files only"
          fi
          echo "=== Icon verification complete ==="

      - name: Build the app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'DarkroomPro ${{ github.ref_name }}'
          releaseBody: |
            ## DarkroomPro ${{ github.ref_name }}

            **Adjustable rotary compensation and E-6 method-specific timing**

            ### Changes
            - **Adjustable B&W rotary compensation:** 0-35% (15% default). The 15% figure is the manufacturer/Massive Dev Chart starting point; 15-35% may be needed depending on film/developer, and pre-wetting or a diffusion enlarger can need less.
            - **E-6 method-specific first developer:** Kodak and Tetenal E-6 now apply the published manual/rotary difference (+15s manual) to the first developer and its push/pull times.
            - **Stock labels:** developer info and dilution selectors now show "Stock" instead of "1:0".
            - Includes all 1.3.0 features: custom agitation, batch reuse compensation, colour temperature lock, UI refresh and darkroom-mode behaviour.

            ### Verification
            - `cargo test`: 17 tests passing.
            - `npm run test:steps`: passing.
            - Browser checks: B&W rotary 15% -> 4:53, 25% -> 4:19; Kodak/Tetenal E-6 manual 6:15 / rotary 6:00; D-76 labels "Stock, 1:1, 1:3".

            See [RELEASE_NOTES.md](https://github.com/Panolix/DarkroomPro/blob/main/RELEASE_NOTES.md) for the full list.

            ### Downloads
            - **macOS**: `.dmg` (universal)
            - **Windows**: `.msi` installer
            - **Linux**: `.deb`, `.rpm` or `.AppImage`

            > Release builds are unsigned. On macOS right-click and choose Open the first time; on Windows SmartScreen may prompt.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

