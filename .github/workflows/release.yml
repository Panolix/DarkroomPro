name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-24.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Clear Tauri cache and ensure fresh icons
        shell: bash
        run: |
          rm -rf src-tauri/target
          rm -rf ~/.cargo/registry/cache || true
          echo "Cleared Tauri build cache to ensure fresh icon build"

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Sync node version and setup cache
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify icon files before build
        shell: bash
        run: |
          echo "=== Verifying icon files exist and are current ==="
          ls -la src-tauri/icons/
          echo "Icon file sizes:"
          if command -v stat >/dev/null 2>&1; then
            if stat -c "%n: %s bytes" src-tauri/icons/icon.png 2>/dev/null; then
              stat -c "%n: %s bytes" src-tauri/icons/icon.png src-tauri/icons/icon.icns src-tauri/icons/32x32.png src-tauri/icons/128x128.png src-tauri/icons/128x128@2x.png 2>/dev/null || true
            else
              stat -f "%N: %z bytes" src-tauri/icons/icon.png src-tauri/icons/icon.icns src-tauri/icons/32x32.png src-tauri/icons/128x128.png src-tauri/icons/128x128@2x.png 2>/dev/null || true
            fi
          else
            echo "stat command not available, listing files only"
          fi
          echo "=== Icon verification complete ==="

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'DarkroomPro ${{ github.ref_name }}'
          releaseBody: |
            ## DarkroomPro ${{ github.ref_name }}

            Data overhaul, accurate push/pull, colour temperature compensation and a batch of reliability fixes.

            ### Data
            - 428 film/developer combinations (up from 366)
            - B&W times and push/pull re-sourced from the Massive Dev Chart and manufacturer datasheets (Ilford, Kodak F-4016/F-4017, Fujifilm, Foma, CineStill)
            - Push/pull uses manufacturer exposure-index tables where published; otherwise the documented Massive Dev Chart push guideline (standard / compensating / T-Max film factors)
            - HC-110 Dilution E corrected to 1:47; added missing Rodinal and manufacturer-supported combinations
            - Corrected film release years and added native-ISO notes for pushed films

            ### C-41 / E-6
            - Per-kit developer times, temperatures, tolerances, agitation and push/pull (Kodak, Tetenal, CineStill, Unicolor, Bellini)
            - Temperature compensation for kits with published time/temperature tables (Tetenal, CineStill, Unicolor): lower-temperature processing is now supported
            - Corrected C-41 and E-6 process templates

            ### Fixes
            - Colour/slide Push 3 and Pull 2 now apply correctly
            - Desktop app now loads the Rust calculation engine (database resource path fix)
            - Half-degree temperature interpolation is consistent across engines
            - Timer audio no longer stops after a few cues
            - Agitation cue now uses the correct initial duration
            - Development time no longer displays ":60"
            - Film panel shows production status and native-ISO notes
            - Warning-free build (dead code removed)

            ### Downloads
            - **macOS**: `.dmg` (universal)
            - **Windows**: `.msi` installer
            - **Linux**: `.deb`, `.rpm` or `.AppImage`

            > Release builds are unsigned. On macOS right-click and choose Open the first time; on Windows SmartScreen may prompt.

            See the [README](https://github.com/Panolix/DarkroomPro/blob/main/README.md) for installation instructions.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

