name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-24.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Clear Tauri cache and ensure fresh icons
        shell: bash
        run: |
          rm -rf src-tauri/target
          rm -rf ~/.cargo/registry/cache || true
          echo "Cleared Tauri build cache to ensure fresh icon build"

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Sync node version and setup cache
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify icon files before build
        shell: bash
        run: |
          echo "=== Verifying icon files exist and are current ==="
          ls -la src-tauri/icons/
          echo "Icon file sizes:"
          if command -v stat >/dev/null 2>&1; then
            if stat -c "%n: %s bytes" src-tauri/icons/icon.png 2>/dev/null; then
              stat -c "%n: %s bytes" src-tauri/icons/icon.png src-tauri/icons/icon.icns src-tauri/icons/32x32.png src-tauri/icons/128x128.png src-tauri/icons/128x128@2x.png 2>/dev/null || true
            else
              stat -f "%N: %z bytes" src-tauri/icons/icon.png src-tauri/icons/icon.icns src-tauri/icons/32x32.png src-tauri/icons/128x128.png src-tauri/icons/128x128@2x.png 2>/dev/null || true
            fi
          else
            echo "stat command not available, listing files only"
          fi
          echo "=== Icon verification complete ==="

      - name: Build the app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'DarkroomPro ${{ github.ref_name }}'
          releaseBody: |
            ## DarkroomPro ${{ github.ref_name }}

            **Kit mixing, capacity and agitation chime fixes**

            ### Changes
            - **Colour kit mixing is explicit:** every colour kit shows its actual mixing and capacity. Bellini C41-RA is 500 ml concentrate + 500 ml water = 1 L (16 rolls).
            - **Dilution ratio and volume input removed:** the ratio is on the developer bottle and in the selector, and tank volume does not change development time. The result card, mix line and volume field are gone.
            - **Capacity corrections:** Kodak Flexicolor 20 rolls per 2.5 L (about 8/L one-shot), Bellini 16 per 1 L, Tetenal C-41 16/L (40 per 2.5 L), CineStill 24 max (8 rated), Unicolor 8/L, Kodak E-6 20 per 5 L (up to 50 extended), Tetenal E-6 30 per 2.5 L, Unicolor E-6 8/L.
            - **Agitation chimes:** repeating tick every ~0.9s at a clearly audible level, with a distinct two-tone stop cue when the window ends. One sound sequence at a time; contiguous windows do not overlap.
            - **Timer cleanup:** pause/reset clears the pulsing orange dot, "Agitate now" text and completion flash immediately.
            - **Kodak E-6 +2 push corrected** to 11:30 rotary / 11:45 manual (+5:30 per Z-119).
            - Includes 1.3.1's adjustable B&W rotary compensation and E-6 method-specific timing.

            ### Verification
            - `cargo test`: 17 tests passing.
            - `npm run test:steps`: passing.
            - Browser checks: Bellini kit mixing/capacity; ~0.9s chime ticks at gain 0.12; stop cue; pause/reset clears dot/text/flash; E-6 +2 push values.

            See [RELEASE_NOTES.md](https://github.com/Panolix/DarkroomPro/blob/main/RELEASE_NOTES.md) for the full list.

            ### Downloads
            - **macOS**: `.dmg` (universal)
            - **Windows**: `.msi` installer
            - **Linux**: `.deb`, `.rpm` or `.AppImage`

            > Release builds are unsigned. On macOS right-click and choose Open the first time; on Windows SmartScreen may prompt.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

